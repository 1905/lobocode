name: Pod image

# ghcr.io/1905/lobocode: llama.cpp server with lobo-agent baked in. Tagged in lockstep with the CLI (v* tags);
# master and feat/** pushes build sha-<commit> tags for testing. Pin by digest: `lobo up --image ghcr.io/1905/lobocode@sha256:…`.
on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - "feat/**"
    paths:
      - "cmd/lobo-agent/**"
      - "internal/**"
      - "docker/pod/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pod-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=sha-$sha; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # one tag list: ":<tag>" + ":sha-<sha>" on a release, only ":sha-<sha>" on a branch
          { echo "tags<<EOF"; echo "ghcr.io/1905/lobocode:sha-$sha"
            [ "$version" != "sha-$sha" ] && echo "ghcr.io/1905/lobocode:$version"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          # the base image comes from the Go pin, so the zip path and the baked path run the same llama-server
          llama=$(sed -n 's/.*DefaultLlamaImage = "\(.*\)"/\1/p' internal/release/manifest.go)
          [ -n "$llama" ] || { echo "DefaultLlamaImage not found"; exit 1; }
          echo "llama=$llama" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pod/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
            LLAMA_IMAGE=${{ steps.meta.outputs.llama }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/1905/lobocode

      - name: Summary
        run: |
          echo "ghcr.io/1905/lobocode@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/1905/lobocode@${{ steps.build.outputs.digest }}"
