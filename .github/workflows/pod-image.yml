name: Pod image

# Complete models need a Linux AMD64 runner with 200 GiB free Docker storage.
# Set POD_IMAGE_RUNNER for release builds. Source CI remains separate.
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable model images (does not move latest tags)
        type: boolean
        default: false
      prebuilt_candidate:
        description: Verify a prepared Q6 OCI export instead of rebuilding model images
        type: boolean
        default: false
      runner_label:
        description: Unique ephemeral runner label beginning with cloud-e2e-
        type: string
        default: ''
      source_sha:
        description: Full source commit baked into the prepared Q6 image
        type: string
        default: ''
      image_digest:
        description: Exact sha256 digest of the prepared OCI image
        type: string
        default: ''
      promote_latest:
        description: Also promote the verified immutable Q6 image to latest-q6 (requires publish)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: pod-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: ${{ !inputs.prebuilt_candidate }}
    runs-on: ${{ vars.POD_IMAGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: [q6, q8]
    steps:
      - uses: actions/checkout@v4
      - name: Check build capacity
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "A Linux AMD64 image builder is required." >&2; exit 1; }
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          free_kib=$(df -Pk "$docker_root" | awk 'NR==2 {print $4}')
          if [ "$free_kib" -lt 209715200 ]; then
            echo "Complete model builds require 200 GiB free Docker storage per concurrent job." >&2
            echo "Set POD_IMAGE_RUNNER to a runner label with sufficient storage; standard hosted runners are too small." >&2
            exit 1
          fi
      - id: meta
        env:
          MODEL: ${{ matrix.model }}
        run: |
          sha=$(git rev-parse --short=12 HEAD)
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=sha-$sha; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/1905/lobocode:sha-$sha-$MODEL"
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "ghcr.io/1905/lobocode:$version-$MODEL"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
          llama=$(sed -n 's/.*DEFAULT_LLAMA_IMAGE: &str = "\(.*\)";/\1/p' crates/lobo-proto/src/release.rs)
          [ -n "$llama" ] || { echo "DEFAULT_LLAMA_IMAGE not found" >&2; exit 1; }
          echo "llama=$llama" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pod/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
            MODEL=${{ matrix.model }}
            LLAMA_IMAGE=${{ steps.meta.outputs.llama }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/1905/lobocode
      - name: Verify anonymous manifest access
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MODEL: ${{ matrix.model }}
        run: |
          # An authenticated push alone does not prove this is a public package.
          token=$(curl --fail --silent --show-error 'https://ghcr.io/token?service=ghcr.io&scope=repository:1905/lobocode:pull' | jq -er .token)
          curl --fail --silent --show-error -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/1905/lobocode/manifests/$DIGEST" -o manifest.json
          actual="sha256:$(sha256sum manifest.json | cut -d ' ' -f 1)"
          [ "$actual" = "$DIGEST" ] || { echo 'Anonymous manifest digest mismatch' >&2; exit 1; }
          mkdir -p digest
          printf '%s\n' "$DIGEST" > "digest/$MODEL.txt"
          echo "ghcr.io/1905/lobocode@$DIGEST ($MODEL)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: image-digest-${{ matrix.model }}
          path: digest/*.txt
          if-no-files-found: error
  promote:
    needs: image
    if: github.event_name == 'push' && inputs.publish && github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Require stable version
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote both accepted model images
        run: |
          for model in q6 q8; do
            digest=$(cat "digest/$model.txt")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          done
          for model in q6 q8; do
            digest=$(cat "digest/$model.txt")
            docker buildx imagetools create --prefer-index=false \
              --tag "ghcr.io/1905/lobocode:latest-$model" "ghcr.io/1905/lobocode@$digest"
            echo "latest-$model -> $digest" >> "$GITHUB_STEP_SUMMARY"
          done
  prebuilt:
    if: github.repository == '1905/lobocode' && github.event_name == 'workflow_dispatch' && inputs.prebuilt_candidate
    # Candidates use exactly the runner's unique custom label. Only labels
    # without the required prefix fall back to hosted input validation.
    runs-on: ${{ startsWith(inputs.runner_label, 'cloud-e2e-') && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE_RUNNER: ${{ inputs.runner_label }}
      CANDIDATE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_DIGEST: ${{ inputs.image_digest }}
      CANDIDATE_PUBLISH: ${{ inputs.publish }}
      CANDIDATE_PROMOTE: ${{ inputs.promote_latest }}
    steps:
      - name: Validate candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 1905/lobocode ]]
          [[ "$CANDIDATE_RUNNER" =~ ^cloud-e2e-[a-z0-9][a-z0-9-]{0,63}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$CANDIDATE_PUBLISH" == true || "$CANDIDATE_PUBLISH" == false ]]
          [[ "$CANDIDATE_PROMOTE" == true || "$CANDIDATE_PROMOTE" == false ]]
          if [[ "$CANDIDATE_PROMOTE" == true && "$CANDIDATE_PUBLISH" != true ]]; then
            echo 'latest-q6 promotion requires explicit publication.' >&2
            exit 1
          fi
          [[ "$(uname -s)/$(uname -m)" == Linux/x86_64 ]]
          # The task runner binds only its completed artifact directory here.
          findmnt --noheadings --output OPTIONS --target /candidate | tr ',' '\n' | grep -qx ro
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify every OCI blob and image identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_cloud_candidate.py \
            --source-sha "$CANDIDATE_SHA" --image-digest "$CANDIDATE_DIGEST" \
            > "$RUNNER_TEMP/candidate-verification.json"
          cat "$RUNNER_TEMP/candidate-verification.json"
          {
            echo 'Prepared Q6 image verification passed. No model was started.'
            echo '```json'
            cat "$RUNNER_TEMP/candidate-verification.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned regctl
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regctl-bin"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 \
            https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64 \
            --output "$RUNNER_TEMP/regctl-bin/regctl"
          printf '%s  %s\n' 8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd \
            "$RUNNER_TEMP/regctl-bin/regctl" | sha256sum --check --status
          chmod 0500 "$RUNNER_TEMP/regctl-bin/regctl"
          "$RUNNER_TEMP/regctl-bin/regctl" version
      - name: Publish the verified immutable image and optionally promote Q6
        if: inputs.publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          regctl="$RUNNER_TEMP/regctl-bin/regctl"
          auth="$RUNNER_TEMP/ghcr-candidate.json"
          export REGCTL_CONFIG="$auth"
          trap 'rm -f "$auth" "$RUNNER_TEMP/anonymous-token.json"' EXIT
          tag="sha-${CANDIDATE_SHA:0:12}-q6"
          repository=ghcr.io/1905/lobocode
          # Anonymous reads distinguish an absent tag from auth/network errors.
          remote_digest() {
            local reference=$1 status anonymous_token
            # A model upload can outlast an anonymous registry token.
            curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
              --max-filesize 1048576 \
              'https://ghcr.io/token?service=ghcr.io&scope=repository:1905/lobocode:pull' \
              --output "$RUNNER_TEMP/anonymous-token.json" || return 1
            anonymous_token=$(jq -er '.token | select(type == "string" and length > 0)' "$RUNNER_TEMP/anonymous-token.json") || return 1
            status=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
              --max-filesize 4194304 --output "$RUNNER_TEMP/remote-manifest.json" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $anonymous_token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/1905/lobocode/manifests/$reference")
            case "$status" in
              200) printf 'sha256:%s\n' "$(sha256sum "$RUNNER_TEMP/remote-manifest.json" | cut -d ' ' -f 1)" ;;
              404) printf 'absent\n' ;;
              *) echo "Anonymous manifest request failed: HTTP $status" >&2; return 1 ;;
            esac
          }
          existing=$(remote_digest "$tag")
          if [[ "$existing" != absent && "$existing" != "$CANDIDATE_DIGEST" ]]; then
            echo 'Immutable tag already points to another image. Preserving it.' >&2
            exit 1
          fi
          # GHCR times out long uploads. Bound each request to 32 MiB and
          # keep at most three requests active within the runner's memory cap.
          "$regctl" registry set ghcr.io --skip-check \
            --blob-chunk 33554432 --blob-max 33554432 --req-concurrent 3
          printf '%s' "$GHCR_TOKEN" | "$regctl" registry login ghcr.io \
            --user "$GITHUB_ACTOR" --pass-stdin
          unset GHCR_TOKEN
          "$regctl" image copy --force-recursive \
            "ocidir:///candidate/q6-oci@$CANDIDATE_DIGEST" "$repository:$tag"
          [[ "$(remote_digest "$tag")" == "$CANDIDATE_DIGEST" ]] || {
            echo 'Anonymous immutable tag digest verification failed.' >&2; exit 1;
          }
          echo "$repository:$tag -> $CANDIDATE_DIGEST (anonymous access verified)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CANDIDATE_PROMOTE" == true ]]; then
            existing=$(remote_digest latest-q6)
            if [[ "$existing" != absent && "$existing" != "$CANDIDATE_DIGEST" ]]; then
              echo 'latest-q6 now points to another image. Preserving it.' >&2
              exit 1
            fi
            "$regctl" image copy "$repository@$CANDIDATE_DIGEST" "$repository:latest-q6"
            [[ "$(remote_digest latest-q6)" == "$CANDIDATE_DIGEST" ]] || {
              echo 'Anonymous latest-q6 digest verification failed.' >&2; exit 1;
            }
            echo "latest-q6 -> $CANDIDATE_DIGEST (anonymous access verified)" >> "$GITHUB_STEP_SUMMARY"
          fi
