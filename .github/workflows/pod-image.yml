name: Pod image

# ghcr.io/1905/lobo: llama.cpp server with lobo-agent baked in. Tagged in lockstep with the CLI (v* tags);
# master and feat/** pushes build sha-<commit> tags for testing. Pin by digest: `lobo up --image ghcr.io/1905/lobo@sha256:…`.
on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - "feat/**"
    paths:
      - "cmd/lobo-agent/**"
      - "internal/**"
      - "docker/pod/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pod-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "version=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pod/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/1905/lobo:${{ steps.meta.outputs.version }}
            ghcr.io/1905/lobo:sha-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/1905/lobocode

      - name: Summary
        run: |
          echo "ghcr.io/1905/lobo@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/1905/lobo@${{ steps.build.outputs.digest }}"
