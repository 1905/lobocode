name: Rust

on:
  push:
    branches: [master, "feat/**"]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Makefile"
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/app-release.yml"
      - "app/**"
      - "tools/protofixtures/**"
      - "tools/corefixtures/**"
      - "tools/clifixtures/**"
      - "tools/native_app_e2e.py"
      - "tools/bounded_runtime_e2e.py"
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rust.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      native_e2e:
        description: Run native end-to-end checks
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust lint and tests
        run: make rust-lint rust-test
      - name: Check generated TypeScript
        run: |
          make proto-ts
          git diff --exit-code -- app/ui/src/proto
          test -z "$(git status --porcelain -- app/ui/src/proto)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go wire fixtures
        run: |
          make proto-fixtures
          git diff --exit-code -- crates/lobo-proto/fixtures crates/lobo-proto/catalog.json
          test -z "$(git status --porcelain -- crates/lobo-proto/fixtures crates/lobo-proto/catalog.json)"

      - name: Check Go core fixtures
        run: |
          make core-fixtures
          git diff --exit-code -- crates/lobo-core/fixtures
          test -z "$(git status --porcelain -- crates/lobo-core/fixtures)"
      - name: Check Go and Rust local-state compatibility
        run: LOBO_GO_INTEROP=1 cargo test --locked -p lobo-core --test go_interop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Go CLI fixtures
        run: |
          make cli-fixtures
          git diff --exit-code -- crates/lobo-cli/tests/fixtures crates/lobo-cli/tests/goldens
          test -z "$(git status --porcelain -- crates/lobo-cli/tests/fixtures crates/lobo-cli/tests/goldens)"

  agent-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static agent
        run: cargo build --release --locked -p lobo-agent --target x86_64-unknown-linux-musl
      - name: Check static executable
        run: |
          file target/x86_64-unknown-linux-musl/release/lobo-agent | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          ls -l target/x86_64-unknown-linux-musl/release/lobo-agent >> "$GITHUB_STEP_SUMMARY"

  core-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Test core, CLI and local process lifecycle
        run: cargo test --locked -p lobo-core -p lobo-cli --features lobo-cli/test-fakes -j 2

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - uses: pnpm/action-setup@v4
        with:
          version: "9.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - name: Install and build UI
        run: |
          pnpm -C app/ui install --frozen-lockfile
          pnpm -C app/ui build
      - name: Generate app fixtures and TypeScript
        run: make app-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: app-generated-ui
          path: |
            app/ui/src/fixtures
            app/ui/src/gen
          retention-days: 7
      - name: App lint and tests
        run: make app-lint app-test
      - name: Check app fixtures and TypeScript
        run: |
          git diff --exit-code -- app/ui/src/fixtures app/ui/src/gen app/ui/src/proto
          test -z "$(git status --porcelain -- app/ui/src/fixtures app/ui/src/gen app/ui/src/proto)"
      - name: Build native app bundle
        run: make mac
      - name: Verify bundle
        run: |
          test -x bin/lobocode.app/Contents/MacOS/lobocode
          test ! -e bin/lobocode.app/Contents/Resources/lobo
          codesign --verify --deep --strict bin/lobocode.app
          python3 - <<'PYCODE'
          import subprocess
          result = subprocess.run(['bin/lobocode.app/Contents/MacOS/lobocode', '--lobo-local-run', 'local', 'run'], capture_output=True, text=True, timeout=10)
          assert result.returncode == 2 and 'cloud GPUs only' in result.stderr
          PYCODE
          ditto -c -k --keepParent bin/lobocode.app bin/lobocode-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lobocode-macos-arm64
          path: bin/lobocode-macos-arm64.zip
          retention-days: 7
      - name: Native startup and settings smoke
        if: github.event_name != 'workflow_dispatch' || inputs.native_e2e
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          make app-e2e-build
          python3 tools/native_app_e2e.py --setup-only
          python3 tools/native_app_e2e.py --legacy-config
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cloud-ui-evidence
          path: bin/app-e2e
          if-no-files-found: ignore
          retention-days: 7
