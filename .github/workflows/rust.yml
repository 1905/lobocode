name: Rust

on:
  push:
    branches: [master, "feat/**"]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Makefile"
      - "app/**"
      - "tools/protofixtures/**"
      - "tools/corefixtures/**"
      - "tools/clifixtures/**"
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rust.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust lint and tests
        run: make rust-lint rust-test
      - name: CLI executable parity with fake providers
        run: cargo test --locked -p lobo-cli --features test-fakes --test cli_fakes
      - name: Check generated TypeScript
        run: |
          make proto-ts
          git diff --exit-code -- app/ui/src/proto
          test -z "$(git status --porcelain -- app/ui/src/proto)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go wire fixtures
        run: |
          make proto-fixtures
          git diff --exit-code -- crates/lobo-proto/fixtures crates/lobo-proto/catalog.json
          test -z "$(git status --porcelain -- crates/lobo-proto/fixtures crates/lobo-proto/catalog.json)"

      - name: Check Go core fixtures
        run: |
          make core-fixtures
          git diff --exit-code -- crates/lobo-core/fixtures
          test -z "$(git status --porcelain -- crates/lobo-core/fixtures)"
      - name: Check Go and Rust local-state compatibility
        run: LOBO_GO_INTEROP=1 cargo test --locked -p lobo-core --test go_interop
      - name: Check Go CLI fixtures
        run: |
          make cli-fixtures
          git diff --exit-code -- crates/lobo-cli/tests/fixtures crates/lobo-cli/tests/goldens
          test -z "$(git status --porcelain -- crates/lobo-cli/tests/fixtures crates/lobo-cli/tests/goldens)"

  agent-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static agent
        run: cargo build --release --locked -p lobo-agent --target x86_64-unknown-linux-musl
      - name: Check static executable
        run: |
          file target/x86_64-unknown-linux-musl/release/lobo-agent | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          ls -l target/x86_64-unknown-linux-musl/release/lobo-agent >> "$GITHUB_STEP_SUMMARY"

  core-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Test core, CLI and local process lifecycle
        run: cargo test --locked -p lobo-core -p lobo-cli -j 2
      - name: CLI executable parity with fake providers
        run: cargo test --locked -p lobo-cli --features test-fakes --test cli_fakes -j 2
