name: Publish model

# Triggered by a tag publish-model/<id>; the workflow file comes from the tagged commit.
on:
  push:
    tags: ["publish-model/*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - id: model
        run: |
          set -euo pipefail
          id=${GITHUB_REF_NAME#publish-model/}
          entry=$(jq -ce --arg id "$id" '.[] | select(.id == $id)' crates/lobo-proto/catalog.json) \
            || { echo "Unknown model id: $id" >&2; exit 1; }
          {
            echo "id=$id"
            echo "repo=$(jq -r .repo <<< "$entry")"
            echo "file=$(jq -r .file <<< "$entry")"
            echo "size=$(jq -r .size <<< "$entry")"
          } >> "$GITHUB_OUTPUT"
      - id: disk
        run: |
          set -euo pipefail
          need=$((25 * 1024 * 1024))
          pick() {
            for d in /mnt "$RUNNER_TEMP"; do
              [ -d "$d" ] || continue
              if [ "$(df -Pk "$d" | awk 'NR==2 {print $4}')" -ge "$need" ]; then echo "$d"; return 0; fi
            done
            return 1
          }
          dir=$(pick || true)
          if [ -z "$dir" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            dir=$(pick || true)
          fi
          [ -n "$dir" ] || { echo "No work directory with 25 GiB free space" >&2; exit 1; }
          sudo mkdir -p "$dir/model"
          sudo chown "$(id -u):$(id -g)" "$dir/model"
          echo "dir=$dir/model" >> "$GITHUB_OUTPUT"
      - name: Download weights and build the CLI
        env:
          REPO: ${{ steps.model.outputs.repo }}
          FILE: ${{ steps.model.outputs.file }}
          DIR: ${{ steps.disk.outputs.dir }}
        run: |
          set -euo pipefail
          curl --fail --location --proto =https --proto-redir =https --retry 5 --retry-all-errors \
            -o "$DIR/$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE" &
          dl=$!
          cargo build --release --locked -p lobo-cli
          wait "$dl" || { echo "Weights download failed" >&2; exit 1; }
      - name: Upload chunks to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          ID: ${{ steps.model.outputs.id }}
          FILE: ${{ steps.model.outputs.file }}
          DIR: ${{ steps.disk.outputs.dir }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/lobo"
          trap 'rm -f "$RUNNER_TEMP/lobo/config.env"' EXIT
          {
            echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID"
            echo "R2_ACCESS_KEY=$R2_ACCESS_KEY"
            echo "R2_SECRET_KEY=$R2_SECRET_KEY"
            echo "R2_ENDPOINT=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          } > "$RUNNER_TEMP/lobo/config.env"
          XDG_CONFIG_HOME=$RUNNER_TEMP target/release/lobo publish-model "$ID" --file "$DIR/$FILE" > chunk_sha.json
      - name: Verify first and last chunk through the CDN
        env:
          ID: ${{ steps.model.outputs.id }}
        run: |
          set -euo pipefail
          base=$(sed -n 's/.*DEFAULT_MODEL_BASE_URL: &str = "\(.*\)";/\1/p' crates/lobo-proto/src/release.rs)
          [ -n "$base" ] || { echo "DEFAULT_MODEL_BASE_URL not found" >&2; exit 1; }
          sha=$(jq -r --arg id "$ID" '.[] | select(.id == $id) | .sha256' crates/lobo-proto/catalog.json)
          n=$(jq length chunk_sha.json)
          [ "$n" -gt 0 ] || { echo "No chunks published" >&2; exit 1; }
          for i in 0 $((n - 1)); do
            want=$(jq -r ".[$i]" chunk_sha.json)
            got=$(curl -fsS "$base/models/$sha/$(printf %03d "$i")" | sha256sum | cut -d ' ' -f 1)
            [ "$got" = "$want" ] || { echo "CDN chunk $i hash mismatch" >&2; exit 1; }
          done
          {
            echo "model $ID: $n chunks"
            echo "first: $(jq -r '.[0]' chunk_sha.json)"
            echo "last: $(jq -r '.[-1]' chunk_sha.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-sha-${{ steps.model.outputs.id }}
          path: chunk_sha.json
          if-no-files-found: error
