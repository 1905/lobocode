[package]
name = "lobocode-app"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "lobocode_app"

[[bin]]
name = "lobocode"
path = "src/main.rs"

[lints.clippy]
all = "warn"

[dependencies]
lobo-core = { path = "../../crates/lobo-core" }
lobo-proto = { path = "../../crates/lobo-proto" }
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-notification = "=2.5.0"
tauri-plugin-clipboard-manager = "=2.4.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.0"
tiny-skia = "=0.12.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dev-dependencies]
lobo-core = { path = "../../crates/lobo-core", features = ["testkit"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
