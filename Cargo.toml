[workspace]
members = ["crates/*"]
exclude = ["app/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.2.0"
repository = "https://github.com/1905/lobocode"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net", "fs", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "stream", "json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
regex-lite = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
wiremock = "0.6"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
